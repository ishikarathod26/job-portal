# ========================
# MySQL Database Configuration
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/myjobportal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate Configuration
# ========================
# 'update' = Hibernate will auto-create/update tables based on entity classes
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in console for debugging
spring.jpa.show-sql=true
# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true
# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Server Configuration
# ========================
server.port=8080

# ========================
# Thymeleaf Configuration
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================
# Application Name
# ========================
spring.application.name=MyJobPortal
